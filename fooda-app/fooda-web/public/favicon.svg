<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="#ff6b35">
  <!-- Fork (left) -->
  <!-- Three tines -->
  <rect x="10" y="4"  width="7" height="27" rx="3.5"/>
  <rect x="21" y="4"  width="7" height="27" rx="3.5"/>
  <rect x="32" y="4"  width="7" height="27" rx="3.5"/>
  <!-- Crossbar connecting tines to stem -->
  <path d="M10 28 Q10 38 24.5 38 Q39 38 39 28 L39 31 Q39 42 24.5 42 Q10 42 10 31 Z"/>
  <!-- Handle stem -->
  <rect x="21" y="38" width="7" height="58" rx="3.5"/>

  <!-- Knife (right) -->
  <!-- Blade: full at base, tapers to a curved point at top -->
  <path d="M59 4 C59 4 73 4 73 28 L73 48 L59 48 Z" rx="2"/>
  <!-- Handle -->
  <rect x="59" y="48" width="14" height="48" rx="7"/>
</svg>
